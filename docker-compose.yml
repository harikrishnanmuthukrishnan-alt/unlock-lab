services:
  unlock-lab:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_FILE: /app/data/db.json
      CAMPUS_TZ_OFFSET: '+05:30'
    volumes:
      - unlock_lab_demo:/app/data
    healthcheck:
      test: ['CMD','node','-e','fetch("http://127.0.0.1:3000/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  unlock_lab_demo:
