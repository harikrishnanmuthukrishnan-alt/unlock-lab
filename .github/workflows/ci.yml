name: UNLOCK Lab — quality gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ''
      - name: Check JS syntax
        run: |
          node --check server.js
          node --check logic.js
          node --check public/app.js
      - name: Run business rule tests
        run: npm test
      - name: Smoke test service
        shell: bash
        run: |
          PORT=3889 DATA_FILE="$RUNNER_TEMP/unlock-ci.json" npm start &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3889/healthz; then exit 0; fi
            sleep 1
          done
          exit 1
